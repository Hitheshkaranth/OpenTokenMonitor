# PR/push validation workflow.
# Note: `tauri build` is intentionally not run here due to CI cost/time;
# release packaging/signing is handled in `.github/workflows/release.yml`.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Build frontend
        run: npm run build

      - name: Setup Rust
        # Pinned by SHA; with a SHA ref the toolchain must be named explicitly.
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint
        run: |
          # TODO: remove -A unused-mut once cleaned.
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings -A unused-mut

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast
