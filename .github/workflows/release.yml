name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create draft GitHub release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true

  build:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
      HAS_APPLE_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundle_cmd: npm run tauri:build:mac
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle_cmd: npm run tauri:build:mac
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_cmd: npm run tauri:build:win
          # 22.04, not 24.04: bundling against the older glibc keeps the
          # AppImage/deb runnable on the long-term-support distros most users
          # are actually on.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle_cmd: npm run tauri:build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Import macOS code-signing certificate
        if: runner.os == 'macOS' && env.HAS_APPLE_CERTIFICATE == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # macOS Gatekeeper: for a release other Macs can open without the
      # "app is damaged / unidentified developer" prompt, the build must be
      # Developer ID signed AND notarized. Provide these repository secrets to
      # enable it. All are optional — when absent the build still succeeds with
      # the current ad-hoc / unsigned output, exactly as before:
      #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD
      #     - Developer ID Application cert exported as base64-encoded .p12
      #   APPLE_SIGNING_IDENTITY
      #     - e.g. "Developer ID Application: Your Name (TEAMID)"
      #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      #     - notarization: Apple ID, an app-specific password, and the team ID
      # BUILDING.md documented WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD
      # as release secrets, but nothing consumed them — Windows artifacts always
      # shipped unsigned. Tauri reads the cert from bundle.windows.certificateThumbprint,
      # so import the PFX and stamp the resulting thumbprint into the config.
      # Skipped entirely when the secrets are absent, leaving today's behaviour.
      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $pfx = Join-Path $env:RUNNER_TEMP 'code-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force
          $conf = 'src-tauri/tauri.conf.json'
          $json = Get-Content $conf -Raw | ConvertFrom-Json
          $json.bundle.windows.certificateThumbprint = $cert.Thumbprint
          $json | ConvertTo-Json -Depth 32 | Set-Content $conf -Encoding utf8
          Write-Host "Signing with certificate $($cert.Thumbprint)"
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      # `createUpdaterArtifacts` ships false so a keyless build succeeds --
      # Tauri fails the bundle step if asked to emit updater artifacts it cannot
      # sign. Turn it on only when the signing key is available.
      - name: Enable updater artifacts
        if: env.HAS_UPDATER_KEY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json
          p = 'src-tauri/tauri.conf.json'
          cfg = json.load(open(p))
          cfg['bundle']['createUpdaterArtifacts'] = True
          json.dump(cfg, open(p, 'w'), indent=2)
          EOF
          echo "updater artifacts enabled"

      - name: Build Tauri bundle
        shell: bash
        run: |
          if [ "${{ secrets.APPLE_ID }}" != "" ]; then
            export APPLE_ID="${{ secrets.APPLE_ID }}"
            export APPLE_PASSWORD="${{ secrets.APPLE_PASSWORD }}"
            export APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          fi
          ${{ matrix.bundle_cmd }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}

      - name: Collect release artifacts
        shell: bash
        run: |
          set -euo pipefail
          out="release-assets/${{ matrix.target }}"
          mkdir -p "$out"
          shopt -s nullglob

          artifacts=(
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          )

          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No release artifacts found" >&2
            find src-tauri/target/release/bundle -maxdepth 3 -type f 2>/dev/null || true
            exit 1
          fi

          cp "${artifacts[@]}" "$out/"

          # Tauri names the macOS updater bundle "OpenTokenMonitor.app.tar.gz"
          # on BOTH arm64 and x86_64. Release assets are flat, so the second
          # upload would overwrite the first and half the Mac users would be
          # served the wrong binary. Disambiguate by target.
          for f in "$out"/*.app.tar.gz "$out"/*.app.tar.gz.sig; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"
            mv "$f" "$out/${{ matrix.target }}-$base"
          done

          ls -la "$out"

      - name: Stage updater signatures for the manifest job
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.target }}
          path: |
            release-assets/${{ matrix.target }}/*.sig
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload build artifacts to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: release-assets/${{ matrix.target }}/*

  # The auto-updater polls this file. Without it the endpoint 404s and no
  # installed copy can ever update itself — see BUILDING.md → Release signing.
  updater-manifest:
    name: Build latest.json
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download staged signatures
        uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: sigs

      - name: Compose latest.json
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/${REPO}/releases/download/${TAG}"

          # target dir -> (updater platform key, asset filename glob)
          declare -A PLATFORM=(
            [aarch64-apple-darwin]=darwin-aarch64
            [x86_64-apple-darwin]=darwin-x86_64
            [x86_64-pc-windows-msvc]=windows-x86_64
            [x86_64-unknown-linux-gnu]=linux-x86_64
          )

          entries=""
          for dir in sigs/updater-*; do
            [ -d "$dir" ] || continue
            target="$(basename "$dir" | sed 's/^updater-//')"
            key="${PLATFORM[$target]:-}"
            if [ -z "$key" ]; then
              echo "::warning::no updater platform key for target $target — skipping"
              continue
            fi

            sig_file="$(find "$dir" -name '*.sig' -type f | head -n1)"
            if [ -z "$sig_file" ]; then
              echo "::warning::no .sig for $target — skipping"
              continue
            fi

            asset="$(basename "$sig_file" .sig)"
            signature="$(cat "$sig_file")"
            entries="${entries}$(printf '"%s":{"signature":"%s","url":"%s/%s"},' \
              "$key" "$signature" "$base" "$asset")"
          done

          if [ -z "$entries" ]; then
            # No signatures at all means updater signing simply isn't set up yet
            # (see BUILDING.md -> Updater Signing). That's a valid way to ship:
            # the app detects the unconfigured key and never calls check().
            # Publish the release without a manifest rather than blocking it.
            echo "::warning::No updater signatures found - publishing without latest.json. \
          Installed copies will NOT be able to auto-update. Generate a keypair and set \
          TAURI_SIGNING_PRIVATE_KEY to enable this."
            exit 0
          fi

          printf '{"version":"%s","pub_date":"%s","notes":"See the release notes at %s/releases/tag/%s","platforms":{%s}}' \
            "$version" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "https://github.com/${REPO}" "$TAG" \
            "${entries%,}" | tee latest.json

          python3 -c "import json,sys; json.load(open('latest.json'))"
          echo "latest.json is valid JSON"

      - name: Attach latest.json to the draft release
        if: hashFiles('latest.json') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: latest.json

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - create-release
      - build
      - updater-manifest
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
